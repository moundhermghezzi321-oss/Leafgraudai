services:
  - type: web
    name: leafguard-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leafguard-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@leafguard.com
      - key: ADMIN_PASSWORD
        value: admin12345

databases:
  - name: leafguard-db
    databaseName: leafguard
    user: leafguard_user
